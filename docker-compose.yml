version: '3.8'

services:
  web:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - SESSION_SECRET=docker_secure_session_secret
      - NODE_ENV=production
    volumes:
      # Keep the sqlite database persistent across restarts

      - sqlite_data:/usr/src/app/caretrack.db
    command: >
      sh -c "npm run seed && npm start"

volumes:
  sqlite_data:
